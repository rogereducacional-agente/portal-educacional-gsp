<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>FAQ | Validação Portal Educacional GSP</title>
  <style>
    :root { --ink:#14213d; --ink-soft:#40516f; --paper:#f4f7fb; --surface:#fff; --line:#d9e2ee; --green:#008a73; --blue:#2a62c9; --purple:#7236c8; --orange:#f26f2b; --yellow:#ffd21c; --shadow:0 18px 46px rgba(20,33,61,.12); --radius:8px; --max:1160px; }
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--paper);line-height:1.5} a{color:inherit;text-decoration:none} button,input{font:inherit} img{max-width:100%;display:block}
    .site-header{position:sticky;top:0;z-index:20;height:72px;display:grid;grid-template-columns:190px minmax(0,1fr);align-items:center;gap:24px;padding:0 clamp(18px,4vw,56px);background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(20,33,61,.08);backdrop-filter:blur(12px)}
    .site-logo img{width:150px;height:auto}.site-menu{display:flex;align-items:center;justify-content:flex-end;gap:18px;min-width:0}.site-menu a{display:inline-flex;align-items:center;min-height:40px;color:#16213f;font-size:13px;font-weight:900;white-space:nowrap}.site-menu a.active{color:var(--green);border-bottom:4px solid var(--green)}
    .hero{background:linear-gradient(90deg,rgba(15,36,77,.94),rgba(114,54,200,.72)),url("assets/gsp/hero-banner-sem-icones.png") center/cover no-repeat;color:#fff;min-height:270px;display:grid;align-items:center;padding:42px clamp(22px,5vw,72px)}.hero-inner{width:min(100%,var(--max));margin:0 auto}.eyebrow{margin:0 0 10px;color:#dcd0ff;font-size:12px;font-weight:950;text-transform:uppercase;letter-spacing:0}h1{margin:0;font-size:clamp(34px,5vw,58px);line-height:1;letter-spacing:0}.lead{max-width:760px;margin:14px 0 0;color:#f3f0ff;font-size:17px}
    main{width:min(100% - 32px,var(--max));margin:0 auto;padding:32px 0 72px}.search-panel{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;margin-bottom:18px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:0 10px 24px rgba(20,33,61,.07)}.search-panel input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:var(--radius);padding:0 14px;color:var(--ink);background:#f8fafc}.btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:var(--radius);padding:0 18px;background:var(--green);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 10px 20px rgba(0,124,105,.18)}
    .stage-nav{display:flex;gap:8px;margin-bottom:24px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.stage-nav::-webkit-scrollbar{display:none}.stage-nav a{flex:0 0 auto;min-height:34px;display:inline-flex;align-items:center;padding:6px 12px;border:1px solid #dfe8f4;border-radius:999px;background:#fff;color:#24405f;font-size:12px;font-weight:900}.faq-groups{display:grid;gap:24px}.faq-group{display:grid;gap:12px}.faq-group h2{margin:0;color:#081b42;font-size:24px;line-height:1.15}.faq-item{overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.faq-item button{width:100%;min-height:62px;display:flex;justify-content:space-between;gap:14px;align-items:center;padding:16px 18px;border:0;border-left:6px solid var(--purple);background:#fff;color:var(--ink);text-align:left;font-weight:950;cursor:pointer}.faq-toggle{flex:0 0 30px;width:30px;height:30px;display:grid;place-items:center;border-radius:999px;background:#f0e8ff;color:var(--purple);font-size:18px}.faq-body{display:none;grid-template-columns:minmax(0,.95fr) minmax(0,1fr) minmax(0,.9fr);gap:14px;padding:0 18px 18px}.faq-item.open .faq-body{display:grid}.check,.answer,.escalate{padding:14px;border-radius:var(--radius);color:var(--ink-soft);font-size:14px}.check{background:#f5efff;border:1px solid #dfcff8}.answer{background:#eefaf7;border:1px solid #c9e9df}.escalate{background:#fff8ec;border:1px solid #ead9b7}.check ul{margin:8px 0 0;padding-left:18px}.check strong,.answer strong,.escalate strong{display:block;margin-bottom:6px;color:var(--ink)}.empty-card{padding:20px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:0 10px 24px rgba(20,33,61,.07)}.footer-line{height:6px;margin-top:38px;background:linear-gradient(90deg,var(--blue) 0 24%,var(--green) 24% 50%,var(--yellow) 50% 74%,var(--orange) 74% 100%)}
    @media(max-width:900px){.site-header{position:static;height:auto;grid-template-columns:1fr;gap:10px;padding:12px 16px}.site-menu{justify-content:flex-start;overflow-x:auto;scrollbar-width:none}.site-menu::-webkit-scrollbar{display:none}.hero{min-height:220px;padding:28px 18px}.search-panel,.faq-body{grid-template-columns:1fr}.faq-item button{align-items:flex-start}}
  </style>
</head>
<body>
  <header class="site-header"><a class="site-logo" href="validacao-alteracoes.html#inicio" aria-label="Great Schools Platform"><img src="assets/gsp/logo-great-schools-platform.png" alt="Great Schools Platform"></a><nav class="site-menu" aria-label="Navegação superior"><a href="validacao-alteracoes.html#inicio">Início</a><a href="validacao-alteracoes.html#guia-amanda">Rematrícula 2027</a><a href="validacao-alteracoes.html#encontrar">Processos e Materiais</a><a href="validacao-alteracoes.html#guia-amanda">Treinamentos e Guias</a><a href="comunicados.html">Comunicados</a><a class="active" href="faq-validacao.html">FAQ</a><a href="validacao-alteracoes.html#salas-validacao">Suporte</a></nav></header>
  <section class="hero"><div class="hero-inner"><p class="eyebrow">Dúvidas e respostas</p><h1>FAQ</h1><p class="lead">Consulte perguntas frequentes da Rematrícula 2027 por etapa do guia, com resposta segura, pontos de conferência e critérios de escalação.</p></div></section>
  <main><div class="search-panel"><input id="faqSearch" type="search" placeholder="Buscar pergunta: senha, aluno, desconto, pagamento, contrato..." autocomplete="off"><button class="btn" id="clearSearch">Limpar</button></div><nav class="stage-nav" id="stageLinks" aria-label="Etapas do FAQ"></nav><div class="faq-groups" id="faqGroups"></div></main>
  <div class="footer-line" aria-hidden="true"></div>
  <script src="assets/rematricula-2027/guide-data.js"></script>
  <script>
    const slug = text => text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    const stageLinks = document.querySelector("#stageLinks");
    const faqGroups = document.querySelector("#faqGroups");
    const faqSearch = document.querySelector("#faqSearch");
    const clearSearch = document.querySelector("#clearSearch");
    function renderFaq(query = "") {
      const normalized = query.trim().toLowerCase();
      stageLinks.innerHTML = window.guideData.map(stage => '<a href="#' + slug(stage.title) + '">' + stage.number + ' · ' + stage.title + '</a>').join("");
      faqGroups.innerHTML = window.guideData.map(stage => {
        const questions = stage.questions.filter(question => (stage.title + ' ' + question.title + ' ' + question.check.join(' ') + ' ' + question.answer + ' ' + question.escalate).toLowerCase().includes(normalized));
        if (!questions.length) return "";
        return '<section class="faq-group" id="' + slug(stage.title) + '"><h2>' + stage.number + ' · ' + stage.title + '</h2>' + questions.map((question, index) => '<article class="faq-item ' + (index === 0 && !normalized ? 'open' : '') + '" id="' + slug(question.title) + '"><button type="button"><span>' + question.title + '</span><span class="faq-toggle">+</span></button><div class="faq-body"><div class="check"><strong>O que conferir</strong><ul>' + question.check.map(item => '<li>' + item + '</li>').join('') + '</ul></div><div class="answer"><strong>Resposta segura</strong>' + question.answer + '</div><div class="escalate"><strong>Quando escalar</strong>' + question.escalate + '</div></div></article>').join('') + '</section>';
      }).join("") || '<article class="empty-card"><strong>Nenhuma pergunta encontrada</strong><p>Revise a palavra pesquisada ou consulte o Guia de Atendimento.</p></article>';
      faqGroups.querySelectorAll(".faq-item button").forEach(button => { button.addEventListener("click", () => button.closest(".faq-item").classList.toggle("open")); });
    }
    faqSearch.addEventListener("input", () => renderFaq(faqSearch.value));
    clearSearch.addEventListener("click", () => { faqSearch.value = ""; renderFaq(); faqSearch.focus(); });
    renderFaq();
  </script>
</body>
</html>
