<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Comunicados | Portal Educacional GSP</title>
  <style>
    :root {
      --ink: #14213d;
      --ink-soft: #40516f;
      --paper: #f4f7fb;
      --surface: #ffffff;
      --line: #d9e2ee;
      --green: #008a73;
      --blue: #2a62c9;
      --orange: #f26f2b;
      --yellow: #ffd21c;
      --shadow: 0 18px 46px rgba(20, 33, 61, .12);
      --radius: 8px;
      --max: 1160px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; font-family: Inter, "Segoe UI", Arial, sans-serif; color: var(--ink); background: var(--paper); line-height: 1.5; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    .site-header { position: sticky; top: 0; z-index: 20; height: 72px; display: grid; grid-template-columns: 190px minmax(0, 1fr); align-items: center; gap: 24px; padding: 0 clamp(18px, 4vw, 56px); background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); box-shadow: 0 8px 24px rgba(20,33,61,.08); backdrop-filter: blur(12px); }
    .site-logo img { width: 150px; height: auto; }
    .site-menu { display: flex; align-items: center; justify-content: flex-end; gap: 18px; min-width: 0; }
    .site-menu a { display: inline-flex; align-items: center; min-height: 40px; color: #16213f; font-size: 13px; font-weight: 900; white-space: nowrap; }
    .site-menu a.active { color: var(--green); border-bottom: 4px solid var(--green); }
    .hero { background: linear-gradient(90deg, rgba(15,36,77,.95), rgba(0,124,105,.82)), url("assets/gsp/hero-banner-sem-icones.png") center / cover no-repeat; color: #fff; min-height: 270px; display: grid; align-items: center; padding: 42px clamp(22px, 5vw, 72px); }
    .hero-inner { width: min(100%, var(--max)); margin: 0 auto; }
    .eyebrow { margin: 0 0 10px; color: #baf5e7; font-size: 12px; font-weight: 950; text-transform: uppercase; letter-spacing: 0; }
    h1 { margin: 0; font-size: clamp(34px, 5vw, 58px); line-height: 1; letter-spacing: 0; }
    .lead { max-width: 760px; margin: 14px 0 0; color: #edf6ff; font-size: 17px; }
    main { width: min(100% - 32px, var(--max)); margin: 0 auto; padding: 32px 0 72px; }
    .toolbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; margin-bottom: 18px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: 0 10px 24px rgba(20,33,61,.07); }
    .toolbar input { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: var(--radius); padding: 0 14px; font: inherit; color: var(--ink); background: #f8fafc; }
    .counter { color: var(--ink-soft); font-size: 13px; font-weight: 850; white-space: nowrap; }
    .timeline { display: grid; gap: 18px; }
    .post { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 22px; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
    .post-media { min-height: 190px; border-radius: var(--radius); overflow: hidden; background: #eaf2f9; }
    .post-media img { width: 100%; height: 100%; object-fit: cover; }
    .tag { display: inline-flex; align-items: center; width: max-content; min-height: 26px; padding: 4px 10px; border-radius: 999px; background: #e9f8f1; color: var(--green); font-size: 12px; font-weight: 950; }
    .post h2 { margin: 12px 0 8px; color: #081b42; font-size: clamp(22px, 3vw, 30px); line-height: 1.12; letter-spacing: 0; }
    .post p { margin: 0; color: #4f6079; font-size: 15px; }
    .post-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #e5edf6; color: #52627a; font-size: 13px; font-weight: 850; }
    .empty-state { display: none; padding: 30px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; color: var(--ink-soft); text-align: center; box-shadow: 0 10px 24px rgba(20,33,61,.07); }
    .footer-line { height: 6px; margin-top: 38px; background: linear-gradient(90deg, var(--blue) 0 24%, var(--green) 24% 50%, var(--yellow) 50% 74%, var(--orange) 74% 100%); }
    @media (max-width: 820px) {
      .site-header { position: static; height: auto; grid-template-columns: 1fr; gap: 10px; padding: 12px 16px; }
      .site-menu { justify-content: flex-start; overflow-x: auto; scrollbar-width: none; }
      .site-menu::-webkit-scrollbar { display: none; }
      .hero { min-height: 220px; padding: 28px 18px; }
      .toolbar { grid-template-columns: 1fr; }
      .post { grid-template-columns: 1fr; padding: 14px; }
      .post-media { min-height: 170px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="validacao-alteracoes.html#inicio" aria-label="Great Schools Platform">
      <img src="assets/gsp/logo-great-schools-platform.png" alt="Great Schools Platform">
    </a>
    <nav class="site-menu" aria-label="Navegação superior">
      <a href="validacao-alteracoes.html#inicio">Início</a>
      <a href="validacao-alteracoes.html#guia-amanda">Rematrícula 2027</a>
      <a href="validacao-alteracoes.html#encontrar">Processos e Materiais</a>
      <a href="validacao-alteracoes.html#guia-amanda">Treinamentos e Guias</a>
      <a class="active" href="comunicados.html">Comunicados</a>
      <a href="validacao-alteracoes.html#salas-validacao">Suporte</a>
    </nav>
  </header>
  <section class="hero">
    <div class="hero-inner">
      <p class="eyebrow">Comunicados oficiais</p>
      <h1>Comunicados</h1>
      <p class="lead">Acompanhe as postagens oficiais do Portal Educacional GSP em ordem cronológica, sempre com a atualização mais recente no começo.</p>
    </div>
  </section>
  <main>
    <div class="toolbar" aria-label="Filtro de comunicados">
      <input id="postSearch" type="search" placeholder="Buscar comunicado por título, descrição, autor ou data..." autocomplete="off">
      <span class="counter" id="postCounter"></span>
    </div>
    <section class="timeline" id="postTimeline" aria-label="Lista de comunicados"></section>
    <p class="empty-state" id="emptyState">Nenhum comunicado encontrado com esse termo.</p>
  </main>
  <div class="footer-line" aria-hidden="true"></div>
  <script>
    const comunicados = [
      {
        titulo: "Comunicados do Portal Educacional GSP",
        descricao: "Área criada para organizar avisos oficiais em formato sequencial, com título, breve descrição, imagem, data de postagem e responsável pela publicação.",
        imagem: "assets/gsp/hero-banner-sem-icones.png",
        data: "2026-09-09",
        postadoPor: "Roger - GreatSchools Platform",
        categoria: "Atualização"
      }
    ];
    const timeline = document.getElementById("postTimeline");
    const searchInput = document.getElementById("postSearch");
    const counter = document.getElementById("postCounter");
    const emptyState = document.getElementById("emptyState");
    function formatDate(dateValue) {
      const parts = dateValue.split("-").map(Number);
      return new Intl.DateTimeFormat("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric" }).format(new Date(parts[0], parts[1] - 1, parts[2]));
    }
    function renderPosts(query = "") {
      const normalizedQuery = query.trim().toLowerCase();
      const ordered = comunicados.slice().sort((a, b) => new Date(b.data) - new Date(a.data));
      const filtered = ordered.filter(post => {
        const searchable = [post.titulo, post.descricao, post.postadoPor, post.categoria, formatDate(post.data)].join(" ").toLowerCase();
        return !normalizedQuery || searchable.includes(normalizedQuery);
      });
      timeline.innerHTML = "";
      filtered.forEach(post => {
        const article = document.createElement("article");
        article.className = "post";
        const media = document.createElement("div");
        media.className = "post-media";
        const image = document.createElement("img");
        image.src = post.imagem;
        image.alt = post.titulo;
        media.appendChild(image);
        const content = document.createElement("div");
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = post.categoria;
        const title = document.createElement("h2");
        title.textContent = post.titulo;
        const description = document.createElement("p");
        description.textContent = post.descricao;
        const meta = document.createElement("div");
        meta.className = "post-meta";
        const dateMeta = document.createElement("span");
        dateMeta.textContent = "Data da postagem: " + formatDate(post.data);
        const authorMeta = document.createElement("span");
        authorMeta.textContent = "Postado por: " + post.postadoPor;
        meta.append(dateMeta, authorMeta);
        content.append(tag, title, description, meta);
        article.append(media, content);
        timeline.appendChild(article);
      });
      counter.textContent = filtered.length + " comunicado" + (filtered.length === 1 ? "" : "s");
      emptyState.style.display = filtered.length ? "none" : "block";
    }
    searchInput.addEventListener("input", event => renderPosts(event.target.value));
    renderPosts();
  </script>
</body>
</html>
