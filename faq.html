<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>FAQ | Portal Educacional GSP</title>
  <style>
    :root {
      --ink: #14213d;
      --ink-soft: #40516f;
      --paper: #f4f7fb;
      --surface: #ffffff;
      --line: #d9e2ee;
      --blue: #0f244d;
      --teal: #007c89;
      --shadow: 0 18px 46px rgba(20, 33, 61, .12);
      --radius: 8px;
      --sidebar: 238px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px 16px;
      background: linear-gradient(180deg, #eef3f8, #dfe8f2);
      border-right: 1px solid #c8d5e4;
      box-shadow: 12px 0 30px rgba(20, 33, 61, .08);
    }

    .back-link, .nav-list a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--blue);
      font-weight: 900;
    }

    .back-link { margin-bottom: 22px; }
    .nav-list { display: grid; gap: 8px; }

    .nav-list a {
      min-height: 42px;
      width: 100%;
      padding: 8px 10px;
      border-radius: var(--radius);
      color: #2e3d58;
      font-size: 14px;
    }

    .nav-list a:hover {
      background: #fff;
      color: var(--blue);
      box-shadow: 0 10px 22px rgba(20, 33, 61, .08);
    }

    .page { min-width: 0; }

    .hero {
      min-height: 230px;
      padding: 34px clamp(22px, 5vw, 64px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 210px;
      gap: 28px;
      align-items: center;
      background: linear-gradient(90deg, #0f244d, #173869);
      color: #fff;
    }

    .hero img {
      width: 100%;
      max-height: 58px;
      object-fit: contain;
      padding: 10px 14px;
      border-radius: var(--radius);
      background: #fff;
      box-shadow: 0 18px 38px rgba(0, 0, 0, .16);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #a9f0e2;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 5vw, 58px);
      line-height: 1;
    }

    .lead {
      max-width: 760px;
      margin: 14px 0 0;
      color: #e9f0ff;
      font-size: 17px;
    }

    main {
      max-width: 1120px;
      padding: 34px clamp(22px, 5vw, 64px) 70px;
    }

    .search-panel {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 14px;
      margin-bottom: 24px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 12px 28px rgba(20, 33, 61, .08);
    }

    .search-panel input {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 14px;
    }

    .btn {
      min-height: 44px;
      border: 0;
      border-radius: var(--radius);
      padding: 0 18px;
      background: #18b6a5;
      color: #062d34;
      font-weight: 900;
      cursor: pointer;
    }

    .faq-groups {
      display: grid;
      gap: 22px;
    }

    .faq-group {
      display: grid;
      gap: 10px;
    }

    .faq-group h2 {
      margin: 0;
      font-size: 24px;
    }

    .faq-item {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 5px solid var(--teal);
      border-radius: var(--radius);
      box-shadow: 0 10px 22px rgba(20, 33, 61, .06);
    }

    .faq-item button {
      width: 100%;
      min-height: 56px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      padding: 14px 16px;
      border: 0;
      background: #fff;
      color: var(--ink);
      text-align: left;
      font-weight: 900;
      cursor: pointer;
    }

    .faq-body {
      display: none;
      grid-template-columns: minmax(0, 1fr) minmax(0, .9fr);
      gap: 14px;
      padding: 0 16px 16px;
    }

    .faq-item.open .faq-body { display: grid; }

    .answer, .escalate {
      padding: 14px;
      border-radius: var(--radius);
      background: #f7fafc;
      color: var(--ink-soft);
      font-size: 14px;
    }

    .answer strong, .escalate strong {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
    }

    @media (max-width: 900px) {
      .layout { display: block; }
      .sidebar { height: auto; }
      .nav-list { display: flex; overflow-x: auto; padding-bottom: 4px; }
      .nav-list a { width: auto; min-width: max-content; }
      .hero { grid-template-columns: 1fr; }
      .hero img { max-width: 190px; }
      .search-panel, .faq-body { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar" aria-label="Navegação do FAQ">
      <a class="back-link" href="index.html">Voltar ao portal</a>
      <nav class="nav-list" id="stageLinks"></nav>
    </aside>

    <div class="page">
      <section class="hero">
        <div>
          <p class="eyebrow">Rematrícula 2027</p>
          <h1>FAQ</h1>
          <p class="lead">Ambiente exclusivo para perguntas e respostas do atendimento, organizado por etapa do guia.</p>
        </div>
        <img src="assets/gsp/logo-great-schools-platform.png" alt="Great Schools Platform">
      </section>

      <main>
        <div class="search-panel">
          <input id="faqSearch" type="search" placeholder="Buscar pergunta: senha, aluno, desconto, pagamento, contrato...">
          <button class="btn" id="clearSearch">Limpar</button>
        </div>
        <div class="faq-groups" id="faqGroups"></div>
      </main>
    </div>
  </div>

  <script src="assets/rematricula-2027/guide-data.js"></script>
  <script>
    const slug = text => text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
    const stageLinks = document.querySelector("#stageLinks");
    const faqGroups = document.querySelector("#faqGroups");
    const faqSearch = document.querySelector("#faqSearch");
    const clearSearch = document.querySelector("#clearSearch");

    function renderFaq(query = "") {
      const normalized = query.trim().toLowerCase();
      stageLinks.innerHTML = window.guideData.map(stage => `<a href="#${slug(stage.title)}">${stage.number} · ${stage.title}</a>`).join("");

      faqGroups.innerHTML = window.guideData.map(stage => {
        const questions = stage.questions.filter(question => `${stage.title} ${question.title} ${question.answer} ${question.escalate}`.toLowerCase().includes(normalized));
        if (!questions.length) return "";
        return `
          <section class="faq-group" id="${slug(stage.title)}">
            <h2>${stage.number} · ${stage.title}</h2>
            ${questions.map((question, index) => `
              <article class="faq-item ${index === 0 && !normalized ? "open" : ""}" id="${slug(question.title)}">
                <button type="button">
                  <span>${question.title}</span>
                  <span>+</span>
                </button>
                <div class="faq-body">
                  <div class="answer"><strong>Resposta segura</strong>${question.answer}</div>
                  <div class="escalate"><strong>Quando escalar</strong>${question.escalate}</div>
                </div>
              </article>
            `).join("")}
          </section>
        `;
      }).join("") || `<article class="faq-item open"><button type="button">Nenhuma pergunta encontrada<span>+</span></button><div class="faq-body"><div class="answer"><strong>Orientação</strong>Revise a busca ou consulte o Guia de Atendimento.</div></div></article>`;

      faqGroups.querySelectorAll(".faq-item button").forEach(button => {
        button.addEventListener("click", () => button.closest(".faq-item").classList.toggle("open"));
      });
    }

    faqSearch.addEventListener("input", () => renderFaq(faqSearch.value));
    clearSearch.addEventListener("click", () => {
      faqSearch.value = "";
      renderFaq();
      faqSearch.focus();
    });
    renderFaq();
  </script>
</body>
</html>
